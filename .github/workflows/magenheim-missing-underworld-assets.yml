name: One-Off Missing Underworld Asset Forge
# Retry after targeted icon verification was scoped to generated families.
# Retry after all named UV authors were corrected.
# Retry after rendering material icons directly from Blender sources.
# Retry after scoping family verification to generated IDs.
# Retry after repairing thin material-plate bevel geometry.
# Retry after fixing named UV layers for vents, stations, tools, and armour.
# Retry after removing stale catalog dependencies from targeted icon renderers.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/magenheim-missing-underworld-assets.yml

permissions:
  contents: write

concurrency:
  group: magenheim-missing-underworld-assets
  cancel-in-progress: false

jobs:
  forge:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'

      - name: Asset dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Provision pinned Blender 5.0.0
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'blender'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = 'blender-5.0.0-windows-x64.zip'
          $base = 'https://download.blender.org/release/Blender5.0'
          Invoke-WebRequest "$base/$file" -OutFile "$dir/$file"
          Invoke-WebRequest "$base/blender-5.0.0.sha256" -OutFile "$dir/blender.sha256"
          $line = Get-Content "$dir/blender.sha256" | Where-Object { $_ -match [regex]::Escape($file) } | Select-Object -First 1
          if (!$line) { throw 'Official Blender checksum file does not contain the pinned archive.' }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "$dir/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Blender checksum mismatch: $actual != $expected" }
          Expand-Archive "$dir/$file" -DestinationPath $dir -Force
          $exe = Join-Path $dir 'blender-5.0.0-windows-x64/blender.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Pinned Blender executable missing after extraction.' }
          "MAGENHEIM_BLENDER=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate only missing Underworld authorities
        shell: pwsh
        run: |
          $targets = @(
            'underworld-material-library',
            'underworld-material-item-models',
            'underworld-resource-icons',
            'underworld-geothermal-vent-models',
            'underworld-station-models',
            'underworld-tool-models',
            'underworld-armour-models',
            'underworld-weapon-models'
          )
          foreach ($id in $targets) {
            Write-Host "=== one-off missing asset generator: $id ==="
            python tools/verify-generated-freshness.py --update $id
            if ($LASTEXITCODE -ne 0) { throw "Missing-asset generator failed: $id" }
          }

          python tools/verify-generated-freshness.py @targets
          if ($LASTEXITCODE -ne 0) { throw 'Targeted generated-asset freshness verification failed.' }

      - name: Commit generated assets and retire this one-off workflow
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          git fetch origin main --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh main before generated-asset commit.' }
          $current = (git rev-parse origin/main).Trim()
          if ($source -ne $current) {
            throw "main advanced during one-off Blender generation ($source -> $current); refusing to overwrite newer work."
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets
          git rm .github/workflows/magenheim-missing-underworld-assets.yml

          if (git diff --cached --quiet) { throw 'One-off forge completed without any generated asset changes.' }
          git commit -m "Generate missing Underworld Blender assets"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push generated Underworld assets to main.' }
