name: Export Magenheim 3D Models

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/Magenheim.Runtime/*Visuals.cs'
      - 'tools/ModelExporter/**'
      - '.github/workflows/export-models.yml'
      - 'assets/**/*.obj'
      - 'assets/**/*.mtl'

permissions:
  contents: read

jobs:
  export-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile and execute procedural model definitions
        run: dotnet run --project tools/ModelExporter/ModelExporter.csproj --configuration Release -- --output "$GITHUB_WORKSPACE/exported-models"

      - name: Verify real OBJ output exists
        shell: bash
        run: |
          set -euo pipefail
          count=$(find exported-models -type f -name '*.obj' | wc -l)
          procedural=$(find exported-models/procedural -type f -name '*.obj' | wc -l)
          echo "Total OBJ files: $count"
          echo "Procedural OBJ files: $procedural"
          test "$count" -gt 0
          test "$procedural" -gt 0
          test -s exported-models/MODEL_MANIFEST.tsv

      - name: Package all model files
        shell: bash
        run: |
          cd exported-models
          zip -r "../Magenheim-All-3D-Models-${GITHUB_SHA}.zip" .

      - name: Upload model archive
        uses: actions/upload-artifact@v4
        with:
          name: Magenheim-All-3D-Models-${{ github.sha }}
          path: Magenheim-All-3D-Models-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
