name: Magenheim Production Forge

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magenheim-production-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'

      - name: .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'

      - name: Production Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Cheap production preflight
        shell: pwsh
        run: |
          python tools/verify-underworld-production-readiness.py
          if ($LASTEXITCODE -ne 0) { throw 'Production preflight failed before Blender provisioning.' }
          $parseScripts = @(
            'tools/blender.ps1','tools/rebuild-underworld-production.ps1',
            'tools/rebuild-crystal-weapons.ps1','tools/rebuild-underworld-weapons.ps1',
            'tools/rebuild-underworld-material-items.ps1',
            'tools/rebuild-rootforged-assets.ps1','tools/rebuild-underworld-geothermal-vents.ps1',
            'tools/rebuild-underworld-stations.ps1',
            'tools/rebuild-underworld-tools.ps1','tools/rebuild-underworld-armour.ps1',
            'tools/rebuild-rootwarren-dungeon.ps1',
            'tools/rebuild-staff-production-assets.ps1'
          )
          foreach ($script in $parseScripts) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$script PowerShell syntax error: $($errors[0].Message)" }
          }
          dotnet run --project tests/Magenheim.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core authority tests failed before Blender provisioning.' }
          dotnet run --project tools/ModelAssetTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Model/runtime material importer tests failed before Blender provisioning.' }
          python tools/verify-generated-freshness.py crystal-tier-icons
          if ($LASTEXITCODE -ne 0) { throw 'Verification-only crystal-tier icons are stale before Blender provisioning.' }
          foreach ($gate in @(
            'verify-model-assets','verify-model-geometry','verify-model-surface-continuity','verify-model-scale',
            'verify-weapon-materials','verify-held-model-orientation','verify-held-model-grip-direction',
            'verify-icon-assets','verify-authored-surface-coverage'
          )) {
            python "tools/$gate.py"
            if ($LASTEXITCODE -ne 0) { throw "Baseline asset gate failed before Blender provisioning: $gate" }
          }

      - name: Provision Valheim compile references
        shell: pwsh
        run: |
          $steam = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $game = Join-Path $env:RUNNER_TEMP 'valheim-server'
          $bep = Join-Path $env:RUNNER_TEMP 'bepinex'
          New-Item -ItemType Directory -Force -Path $steam,$game,$bep | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile "$steam/steamcmd.zip"
          Expand-Archive "$steam/steamcmd.zip" -DestinationPath $steam -Force
          $steamHash = (Get-FileHash "$steam/steamcmd.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "MAGENHEIM_STEAMCMD_PACKAGE_SHA256=$steamHash" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$steam/steamcmd.exe" +force_install_dir $game +login anonymous +app_update 896660 validate +quit
          if ($LASTEXITCODE -ne 0) { throw 'Valheim Dedicated Server reference install failed.' }

          Invoke-WebRequest 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2351/' -OutFile "$bep/bepinex.zip"
          Expand-Archive "$bep/bepinex.zip" -DestinationPath $bep -Force
          $bepPackageHash = (Get-FileHash "$bep/bepinex.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "MAGENHEIM_BEPINEX_PACKAGE_SHA256=$bepPackageHash" | Out-File -FilePath $env:GITHUB_ENV -Append

          $assembly = Get-ChildItem -LiteralPath $game -Filter assembly_valheim.dll -File -Recurse | Select-Object -First 1
          if (!$assembly) { throw 'Dedicated Server did not supply assembly_valheim.dll.' }
          $bepDll = Get-ChildItem -LiteralPath $bep -Filter BepInEx.dll -File -Recurse | Select-Object -First 1
          if (!$bepDll) { throw 'Pinned BepInEx pack did not supply BepInEx.dll.' }
          $managed = $assembly.DirectoryName
          $bepCore = $bepDll.DirectoryName
          if ((Split-Path $bepCore -Leaf) -ne 'core') { throw "Unexpected BepInEx.dll layout: $bepCore" }
          $bepPath = Split-Path $bepCore -Parent
          "MAGENHEIM_VALHEIM_MANAGED=$managed" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MAGENHEIM_BEPINEX=$bepPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile runtime against current Valheim
        shell: pwsh
        run: |
          dotnet build src/Magenheim.Runtime -c Release "-p:ValheimManagedPath=$env:MAGENHEIM_VALHEIM_MANAGED" "-p:BepInExPath=$env:MAGENHEIM_BEPINEX"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime compile failed before Blender execution.' }

      - name: Provision pinned Blender 5.0.0
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'blender'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = 'blender-5.0.0-windows-x64.zip'
          $base = 'https://download.blender.org/release/Blender5.0'
          Invoke-WebRequest "$base/$file" -OutFile "$dir/$file"
          Invoke-WebRequest "$base/blender-5.0.0.sha256" -OutFile "$dir/blender.sha256"
          $line = Get-Content "$dir/blender.sha256" | Where-Object { $_ -match [regex]::Escape($file) } | Select-Object -First 1
          if (!$line) { throw 'Official Blender checksum file does not contain the pinned archive.' }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "$dir/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Blender checksum mismatch: $actual != $expected" }
          "MAGENHEIM_BLENDER_ARCHIVE_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append
          Expand-Archive "$dir/$file" -DestinationPath $dir -Force
          $exe = Join-Path $dir 'blender-5.0.0-windows-x64/blender.exe'
          if (!(Test-Path $exe)) { throw 'Pinned Blender executable missing after extraction.' }
          "MAGENHEIM_BLENDER=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: One-run production rebuild
        shell: pwsh
        run: |
          ./tools/rebuild-underworld-production.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Magenheim production forge failed.' }

      - name: Post-forge Rootwarren admission gates
        shell: pwsh
        run: |
          python tools/verify-rootwarren-production-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Rootwarren post-promotion contract failed.' }
          dotnet run --project tests/Magenheim.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed after Rootwarren promotion.' }
          dotnet build src/Magenheim.Runtime -c Release "-p:ValheimManagedPath=$env:MAGENHEIM_VALHEIM_MANAGED" "-p:BepInExPath=$env:MAGENHEIM_BEPINEX"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime compile failed after Rootwarren promotion.' }

      - name: Record production provenance and source drift
        id: provenance
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          $short = $source.Substring(0, 12)
          git fetch origin main --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh authoritative main for source-drift check.' }
          $currentMain = (git rev-parse origin/main).Trim()
          $drift = $source -ne $currentMain
          $status = if ($drift) { 'stale' } else { 'current' }

          $review = 'dist/underworld-production-review'
          New-Item -ItemType Directory -Force -Path $review | Out-Null
          $assembly = Join-Path $env:MAGENHEIM_VALHEIM_MANAGED 'assembly_valheim.dll'
          $bepDll = Join-Path $env:MAGENHEIM_BEPINEX 'core/BepInEx.dll'
          $blenderVersion = (& $env:MAGENHEIM_BLENDER --version | Select-Object -First 1).Trim()
          $pythonVersion = (python --version 2>&1 | Select-Object -First 1).ToString().Trim()
          $dotnetVersion = (dotnet --version).Trim()

          $provenance = [ordered]@{
            sourceCommit = $source
            authoritativeMainAtCompletion = $currentMain
            sourceState = $status
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            githubRunId = $env:GITHUB_RUN_ID
            githubRunAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerOS = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            runnerImageOS = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            python = $pythonVersion
            dotnetSdk = $dotnetVersion
            blender = $blenderVersion
            blenderArchiveSha256 = $env:MAGENHEIM_BLENDER_ARCHIVE_SHA256
            blenderExecutableSha256 = (Get-FileHash $env:MAGENHEIM_BLENDER -Algorithm SHA256).Hash.ToLowerInvariant()
            steamCmdPackageSha256 = $env:MAGENHEIM_STEAMCMD_PACKAGE_SHA256
            valheimAssemblySha256 = (Get-FileHash $assembly -Algorithm SHA256).Hash.ToLowerInvariant()
            bepInExPackageSha256 = $env:MAGENHEIM_BEPINEX_PACKAGE_SHA256
            bepInExSha256 = (Get-FileHash $bepDll -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $provenance | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$review/provenance.json"

          "MAGENHEIM_SOURCE_SHORT=$short" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MAGENHEIM_SOURCE_STATE=$status" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MAGENHEIM_SOURCE_SHA=$source" | Out-File -FilePath $env:GITHUB_ENV -Append
          "source_sha=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "source_state=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($drift) {
            "### WARNING: main advanced during Blender production" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "Generated output is preserved against source $source, but is not merge-ready until reconciled with $currentMain." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "### Source provenance clean" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "Generated output corresponds to current main commit $source." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Preserve generated fallback before push
        shell: pwsh
        run: |
          $fallback = 'dist/generated-fallback'
          New-Item -ItemType Directory -Force -Path $fallback | Out-Null
          $changed = git status --porcelain | ForEach-Object { $_.Substring(3) }
          if (!$changed) { throw 'Production forge completed without generated asset changes.' }
          foreach ($path in $changed) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $target = Join-Path $fallback $path
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item -LiteralPath $path -Destination $target -Force
          }
          $changed | Set-Content -LiteralPath "$fallback/changed-files.txt"

      - name: Commit generated result to review branch
        id: push_generated
        continue-on-error: true
        shell: pwsh
        run: |
          $branch = "production/blender-$env:MAGENHEIM_SOURCE_SHORT-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:MAGENHEIM_SOURCE_STATE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b $branch
          git add -A assets
          git add src/Magenheim.Core/Underworld/UnderworldDungeonCatalog.cs
          if (git diff --cached --quiet) { throw 'No generated asset/admission changes were staged.' }
          git commit -m "Generate and admit gated Magenheim production assets ($env:GITHUB_RUN_ID)"
          git push origin "HEAD:refs/heads/$branch"
          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "### Generated branch: $branch" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:MAGENHEIM_SOURCE_STATE -eq 'current') {
            "Blender 5.0.0 output passed machine gates against current main. Review the contact sheets before merging." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "Blender output passed machine gates against $env:MAGENHEIM_SOURCE_SHA but main advanced during the run. Reconcile before merging." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload visual acceptance plates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magenheim-production-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/underworld-production-review/**
            ${{ runner.temp }}/magenheim-blender/**
          if-no-files-found: warn
          retention-days: 3

      - name: Preserve generated assets if branch push failed
        if: steps.push_generated.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magenheim-generated-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/generated-fallback/**
          if-no-files-found: error
          retention-days: 1

      - name: Require durable generated branch
        if: steps.push_generated.outcome == 'failure'
        shell: pwsh
        run: throw 'Generated assets passed production but could not be pushed; one-day fallback artifact was preserved.'
