name: Nowhere King Sword Forge

on:
  push:
    branches:
      - main
    paths:
      - '.github/nowhere-king-swords.run'

permissions:
  contents: write

concurrency:
  group: nowhere-king-sword-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'

      - name: Preflight only the twin-sword toolchain
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          python -m py_compile tools/author-nowhere-king-swords.py tools/verify-nowhere-king-swords.py tools/export-model-assets.py tools/render-weapon-icons.py tools/refresh-nowhere-king-catalog.py tools/verify-nowhere-king-generated-assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Twin-sword Python preflight failed.' }
          foreach ($script in @('tools/blender.ps1','tools/rebuild-nowhere-king-swords.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$script PowerShell syntax error: $($errors[0].Message)" }
          }

      - name: Provision pinned Blender 5.0.0
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'blender'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = 'blender-5.0.0-windows-x64.zip'
          $base = 'https://download.blender.org/release/Blender5.0'
          Invoke-WebRequest "$base/$file" -OutFile "$dir/$file"
          Invoke-WebRequest "$base/blender-5.0.0.sha256" -OutFile "$dir/blender.sha256"
          $line = Get-Content "$dir/blender.sha256" | Where-Object { $_ -match [regex]::Escape($file) } | Select-Object -First 1
          if (!$line) { throw 'Official Blender checksum file does not contain the pinned archive.' }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "$dir/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Blender checksum mismatch: $actual != $expected" }
          Expand-Archive "$dir/$file" -DestinationPath $dir -Force
          $exe = Join-Path $dir 'blender-5.0.0-windows-x64/blender.exe'
          if (!(Test-Path $exe)) { throw 'Pinned Blender executable missing after extraction.' }
          "MAGENHEIM_BLENDER=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Author, verify and export only Firmament and Null Gate
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          ./tools/rebuild-nowhere-king-swords.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Nowhere King twin-sword rebuild failed.' }

      - name: Provision current Valheim and BepInEx compile references
        shell: pwsh
        run: |
          $steam = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $game = Join-Path $env:RUNNER_TEMP 'valheim-server'
          $bep = Join-Path $env:RUNNER_TEMP 'bepinex'
          New-Item -ItemType Directory -Force -Path $steam,$game,$bep | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile "$steam/steamcmd.zip"
          Expand-Archive "$steam/steamcmd.zip" -DestinationPath $steam -Force
          # A brand-new SteamCMD install may consume its first invocation updating itself and then
          # exit before processing +app_update ("Missing configuration"). Bootstrap it once, then
          # run the actual dedicated-server install with the updated client.
          & "$steam/steamcmd.exe" +quit
          & "$steam/steamcmd.exe" +force_install_dir $game +login anonymous +app_update 896660 validate +quit
          if ($LASTEXITCODE -ne 0) { throw 'Valheim Dedicated Server reference install failed after SteamCMD bootstrap.' }
          Invoke-WebRequest 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2351/' -OutFile "$bep/bepinex.zip"
          Expand-Archive "$bep/bepinex.zip" -DestinationPath $bep -Force
          $assembly = Get-ChildItem -LiteralPath $game -Filter assembly_valheim.dll -File -Recurse | Select-Object -First 1
          $bepDll = Get-ChildItem -LiteralPath $bep -Filter BepInEx.dll -File -Recurse | Select-Object -First 1
          if (!$assembly -or !$bepDll) { throw 'Required Valheim/BepInEx compile references were not provisioned.' }
          "MAGENHEIM_VALHEIM_MANAGED=$($assembly.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bepCore = $bepDll.DirectoryName
          "MAGENHEIM_BEPINEX=$(Split-Path $bepCore -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile changed runtime against current Valheim
        shell: pwsh
        run: |
          dotnet build src/Magenheim.Runtime -c Release "-p:ValheimManagedPath=$env:MAGENHEIM_VALHEIM_MANAGED" "-p:BepInExPath=$env:MAGENHEIM_BEPINEX"
          if ($LASTEXITCODE -ne 0) { throw 'Nowhere King runtime compile failed.' }

      - name: Enforce surgical output scope
        shell: pwsh
        run: |
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -eq 0) { throw 'Twin-sword forge produced no changed assets.' }
          $allowed = @(
            '^assets/models/source/nowhere-king-sword-(firmament|null-gate)\.blend$',
            '^assets/models/glb/nowhere-king-sword-(firmament|null-gate)\.glb$',
            '^assets/models/runtime/nowhere-king-sword-(firmament|null-gate)\.model\.json$',
            '^assets/earth/nowhere-king-sword-(firmament|null-gate)\.icon\.png$',
            '^assets/models/catalog\.(json|tsv)$',
            '^assets/models/textures/[0-9a-f]{16}\.png$'
          )
          $unexpected = @()
          foreach ($path in $changed) {
            $ok = $false
            foreach ($pattern in $allowed) {
              if ($path -match $pattern) { $ok = $true; break }
            }
            if (!$ok) { $unexpected += $path }
          }
          if ($unexpected.Count -gt 0) { throw "Forge escaped allowlist: $($unexpected -join ', ')" }

      - name: Commit generated pair to review branch
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          $short = $source.Substring(0,12)
          $branch = "production/nowhere-king-swords-$short-$env:GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b $branch
          git add -- assets/models/source/nowhere-king-sword-firmament.blend assets/models/source/nowhere-king-sword-null-gate.blend
          git add -- assets/models/glb/nowhere-king-sword-firmament.glb assets/models/glb/nowhere-king-sword-null-gate.glb
          git add -- assets/models/runtime/nowhere-king-sword-firmament.model.json assets/models/runtime/nowhere-king-sword-null-gate.model.json
          git add -- assets/earth/nowhere-king-sword-firmament.icon.png assets/earth/nowhere-king-sword-null-gate.icon.png
          git add -- assets/models/catalog.json assets/models/catalog.tsv assets/models/textures
          if (git diff --cached --quiet) { throw 'No allowed twin-sword assets were staged.' }
          git commit -m "Generate Nowhere King twin sword assets ($env:GITHUB_RUN_ID)"
          git push origin "HEAD:refs/heads/$branch"
          "Generated branch: $branch" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload Blender logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nowhere-king-swords-${{ github.run_id }}
          path: ${{ runner.temp }}/magenheim-blender/**
          if-no-files-found: warn
          retention-days: 2
