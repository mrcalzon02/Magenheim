name: Blackstone Throne Forge

on:
  push:
    branches:
      - main
    paths:
      - '.github/blackstone-throne.run'

permissions:
  contents: write

concurrency:
  group: blackstone-throne-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Preflight Blackstone authoring lane
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          python -m py_compile tools/generate-blackstone-throne-textures.py tools/author-blackstone-throne-set.py tools/verify-blackstone-throne-set.py tools/record-blackstone-throne-generated-assets.py tools/export-model-assets.py tools/verify-model-assets.py tools/render-blackstone-throne-review.py
          if ($LASTEXITCODE -ne 0) { throw 'Blackstone Python preflight failed.' }
          foreach ($script in @('tools/blender.ps1','tools/rebuild-blackstone-throne-set.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$script PowerShell syntax error: $($errors[0].Message)" }
          }

      - name: Provision pinned Blender 5.0.0
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'blender'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = 'blender-5.0.0-windows-x64.zip'
          $base = 'https://download.blender.org/release/Blender5.0'
          Invoke-WebRequest "$base/$file" -OutFile "$dir/$file"
          Invoke-WebRequest "$base/blender-5.0.0.sha256" -OutFile "$dir/blender.sha256"
          $line = Get-Content "$dir/blender.sha256" | Where-Object { $_ -match [regex]::Escape($file) } | Select-Object -First 1
          if (!$line) { throw 'Official Blender checksum file does not contain the pinned archive.' }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "$dir/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Blender checksum mismatch: $actual != $expected" }
          Expand-Archive "$dir/$file" -DestinationPath $dir -Force
          $exe = Join-Path $dir 'blender-5.0.0-windows-x64/blender.exe'
          if (!(Test-Path $exe)) { throw 'Pinned Blender executable missing after extraction.' }
          "MAGENHEIM_BLENDER=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Author and export Blackstone Throne family
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          ./tools/rebuild-blackstone-throne-set.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Blackstone Throne rebuild failed.' }

      - name: Render actual Blackstone review views
        shell: pwsh
        run: |
          & $env:MAGENHEIM_BLENDER --background --factory-startup --python tools/render-blackstone-throne-review.py
          if ($LASTEXITCODE -ne 0) { throw 'Blackstone Throne review rendering failed.' }

      - name: Enforce Blackstone output scope
        shell: pwsh
        run: |
          $changed = @(git status --porcelain --untracked-files=all | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -eq 0) { throw 'Blackstone forge produced no changed assets.' }
          $allowed = @(
            '^assets/models/source/(blackstone-[a-z0-9-]+|dark-throne)\.blend$',
            '^assets/models/glb/(blackstone-[a-z0-9-]+|dark-throne)\.glb$',
            '^assets/models/runtime/(blackstone-[a-z0-9-]+|dark-throne)\.model\.json$',
            '^assets/models/textures/[0-9a-f]{16}\.png$',
            '^assets/models/catalog\.(json|tsv)$',
            '^assets/textures/underworld/blackstone/blackstone-[a-z0-9-]+\.png$',
            '^assets/material-source/blackstone/blackstone-[a-z0-9-]+\.png$',
            '^assets/generated\.manifest\.json
          )
          $unexpected = @()
          foreach ($path in $changed) {
            $ok = $false
            foreach ($pattern in $allowed) {
              if ($path -match $pattern) { $ok = $true; break }
            }
            if (!$ok) { $unexpected += $path }
          }
          if ($unexpected.Count -gt 0) { throw "Blackstone forge escaped allowlist: $($unexpected -join ', ')" }

      - name: Commit generated Blackstone assets to review branch
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          $short = $source.Substring(0,12)
          $branch = "production/blackstone-throne-$short-$env:GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b $branch
          git add -- assets/models/source assets/models/glb assets/models/runtime assets/models/textures
          git add -- assets/models/catalog.json assets/models/catalog.tsv
          git add -- assets/textures/underworld/blackstone assets/material-source/blackstone assets/generated.manifest.json
          git add -- dist/blackstone-throne-review
          if (git diff --cached --quiet) { throw 'No Blackstone assets were staged.' }
          git commit -m "Generate Blackstone Throne structure assets ($env:GITHUB_RUN_ID)"
          git push origin "HEAD:refs/heads/$branch"
          "Generated branch: $branch" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload actual Blackstone review renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blackstone-throne-review-${{ github.run_id }}
          path: dist/blackstone-throne-review/*.png
          if-no-files-found: warn
          retention-days: 5

      - name: Upload Blender logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blackstone-throne-${{ github.run_id }}
          path: ${{ runner.temp }}/magenheim-blender/**
          if-no-files-found: warn
          retention-days: 2
,
            '^dist/blackstone-throne-review/[0-9a-z-]+\.png
          )
          $unexpected = @()
